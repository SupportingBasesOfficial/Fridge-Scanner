name: BE-00 Lockfile Bootstrap

on:
  push:
    branches:
      - backend/be-00-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-lockfile:
    if: ${{ github.repository == 'SupportingBasesOfficial/Fridge-Scanner' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch HEAD
        uses: actions/checkout@v4
        with:
          ref: backend/be-00-foundation

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Generate and commit canonical lockfile once
        shell: bash
        run: |
          set -euo pipefail
          if test -f package-lock.json; then
            echo 'package-lock.json already exists; nothing to bootstrap.'
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build(be-00): pin npm dependency graph'
          git push origin HEAD:backend/be-00-foundation
